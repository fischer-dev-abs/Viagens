<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Horizonte Viagens - Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="auth-card">

        <h1>✈️ Horizonte Viagens</h1>

        <p class="subtitle">
            Criar nova conta
        </p>

        <form id="cadastro-form">

            <div class="form-row">

                <div class="form-group">
                    <label for="reg-nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="reg-nome"
                        required
                        minlength="3"
                    >
                </div>


                <div class="form-group">
                    <label for="reg-sobrenome">
                        Sobrenome
                    </label>

                    <input
                        type="text"
                        id="reg-sobrenome"
                        required
                        minlength="3"
                    >
                </div>

            </div>


            <div class="form-group">
                <label for="reg-email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="reg-email"
                    placeholder="exemplo@email.com"
                    required
                >
            </div>


            <div class="form-group">
                <label for="reg-telefone">
                    Telefone
                </label>

                <input
                    type="text"
                    id="reg-telefone"
                    placeholder="(XX) XXXXX-XXXX"
                    required
                >
            </div>


            <div class="form-group">
                <label for="reg-nascimento">
                    Data de Nascimento
                </label>

                <input
                    type="date"
                    id="reg-nascimento"
                    required
                >
            </div>


            <div class="form-group">
                <label for="reg-senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="reg-senha"
                    required
                >
            </div>


            <button
                type="submit"
                class="btn"
            >
                Criar Conta
            </button>

        </form>


        <a
            href="index.html"
            class="btn btn-secondary"
        >
            Voltar para Login
        </a>

    </div>


    <script src="script.js"></script>

</body>
</html>
