<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizonte Viagens - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="auth-card">

        <h1>Horizonte Viagens</h1>

        <p class="subtitle">
            Sistema de Turismo
        </p>

        <div class="tabs">
    <button type="button" class="tab ativa" id="tab-cliente">Cliente</button>
    <button type="button" class="tab" id="tab-admin">Administrador</button>
        </div>

        <form id="login-form">

            <div class="form-group">
                <label for="login-email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="form-group">
                <label for="login-senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="login-senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Entrar
            </button>

        </form>

        <div class="divider">
            ou
        </div>

              <a href="cadastro.html" class="btn btn-secondary">
            Criar uma conta
        </a>


        <!-- Sub-item: login do administrador -->
        <div id="admin-sub" class="admin-sub" hidden>
            <form id="admin-login-form">

                <div class="form-group">
                    <label for="admin-email">E-mail do administrador</label>
                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Digite o e-mail do administrador"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="admin-senha">Senha do administrador</label>
                    <input
                        type="password"
                        id="admin-senha"
                        placeholder="Digite a senha"
                        required
                    >
                </div>

                <p id="admin-erro" class="form-erro" role="alert"></p>

                <button type="submit" class="btn">
                    Acessar painel
                </button>

            </form>
        </div>

    </div>

             </div>
    
          <script src="script.js"></script>
    <script>
        const tabCliente = document.getElementById("tab-cliente");
        const tabAdmin = document.getElementById("tab-admin");
        const painelCliente = document.getElementById("painel-cliente");
        const painelAdmin = document.getElementById("painel-admin");

        tabCliente.onclick = function () {
            painelCliente.hidden = false;
            painelAdmin.hidden = true;
            tabCliente.classList.add("ativa");
            tabAdmin.classList.remove("ativa");
        };

        tabAdmin.onclick = function () {
            painelCliente.hidden = true;
            painelAdmin.hidden = false;
            tabAdmin.classList.add("ativa");
            tabCliente.classList.remove("ativa");
        };
    </script>

</body>
</html>
