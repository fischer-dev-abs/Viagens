<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizonte Viagens - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="auth-card">

        <h1>Horizonte Viagens</h1>

        <p class="subtitle">
            Sistema de Turismo
        </p>

        <form id="login-form">

            <div class="form-group">
                <label for="login-email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="form-group">
                <label for="login-senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="login-senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Entrar
            </button>

        </form>

        <div class="divider">
            ou
        </div>

        <a href="cadastro.html" class="btn btn-secondary">
            Criar uma conta
        </a>

              <a href="cadastro.html" class="btn btn-secondary">
            Criar uma conta
        </a>

        <!-- Botão Administrador (abre/fecha o sub-item) -->
        <button
            type="button"
            id="btn-admin-toggle"
            class="btn btn-admin"
            aria-expanded="false"
            aria-controls="admin-sub"
        >
            Administrador
        </button>

        <!-- Sub-item: login do administrador -->
        <div id="admin-sub" class="admin-sub" hidden>
            <form id="admin-login-form">

                <div class="form-group">
                    <label for="admin-email">E-mail do administrador</label>
                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Digite o e-mail do administrador"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="admin-senha">Senha do administrador</label>
                    <input
                        type="password"
                        id="admin-senha"
                        placeholder="Digite a senha"
                        required
                    >
                </div>

                <p id="admin-erro" class="form-erro" role="alert"></p>

                <button type="submit" class="btn">
                    Acessar painel
                </button>

            </form>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
